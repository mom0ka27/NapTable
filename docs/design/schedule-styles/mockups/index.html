 let panelCss=`left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${H}px;`;
 if(id=="modern")panelCss+=`border-radius:20px;background:${t.panel};border:1px solid ${t.pline};`;
 if(id=="table")panelCss+=`border-radius:10px;background:${t.panel};border:1px solid ${t.pline};overflow:hidden;`;
 if(id=="paper")panelCss+=`background:${t.panel};border:1.6px solid ${t.pline};`;
 if(id=="board")panelCss+=`background:${t.panel};`;
 const P=A(p,panelCss);
 if(id=="paper")A(P,`left:2.5px;top:2.5px;right:2.5px;bottom:2.5px;border:.6px solid ${t.pline};opacity:.55`);
 // weekend / holiday fills (grid)
 if(id=="table"){
  [5,6].forEach(i=>A(P,`left:${colX(i)}px;top:${g.head}px;width:${colW}px;height:${H-g.head}px;background:${t.wkend}`));
  A(P,`left:${colX(0)}px;top:${g.head}px;width:${colW}px;height:${H-g.head}px;background:repeating-linear-gradient(135deg,transparent 0 6px,${dark?"rgba(255,255,255,.05)":"rgba(20,22,26,.045)"} 6px 7px)`);
  A(P,`left:0;top:0;width:${g.w}px;height:${g.head}px;background:${t.head}`);
  A(P,`left:0;top:${g.head}px;width:${g.axis}px;height:${H-g.head}px;background:${t.head}`);
 }
 // today column
 if(t.today!="transparent")A(P,`left:${colX(2)}px;top:${id=="table"?g.head:0}px;width:${colW}px;height:${id=="table"?H-g.head:H}px;background:${t.today};${id=="modern"?"border-radius:12px;":""}`);
 // rules
 for(let i=0;i<=11;i++){
  const y=g.head+rowY(i);
  if(id=="modern"&&i>0&&i<11)A(P,`left:${g.axis}px;top:${y}px;width:${g.w-g.axis-g.pad}px;height:0;border-top:.5px solid ${t.rule}`);
  if(id=="table"&&i<11)A(P,`left:0;top:${y}px;width:${g.w}px;height:0;border-top:${i==0?1:.5}px solid ${i==0?t.pline:t.rule}`);
  if(id=="paper"&&i>0&&i<11)A(P,`left:${g.axis}px;top:${y}px;width:${g.w-g.axis-g.pad}px;height:0;border-top:${(i==4||i==8)?".8px solid "+t.rule2:".6px dotted "+t.rule2}`);
  if(id=="board"&&i<11&&!(i==4||i==8))A(P,`left:${g.axis}px;top:${y}px;width:${g.w-g.axis}px;height:0;border-top:.5px solid ${t.rule}`);
 }
 if(id=="paper")A(P,`left:6px;top:${g.head}px;width:${g.w-12}px;height:0;border-top:.8px solid ${t.rule2}`);
 if(id=="board"){
  [[0,"上午"],[4,"下午"],[8,"晚上"]].forEach(([i,l])=>{
   const y=g.head+rowY(i);
   if(i>0)A(P,`left:10px;top:${y-g.gap+3}px;font:700 10px var(--sans);color:${t.ink2};letter-spacing:1px`,l);
   A(P,`left:0;top:${y}px;width:${g.w}px;height:0;border-top:1.6px solid ${t.pline}`);
  });
 }
 if(id=="table"){
  A(P,`left:${g.axis}px;top:0;width:0;height:${H}px;border-left:1px solid ${t.pline}`);
  for(let i=1;i<7;i++)A(P,`left:${colX(i)}px;top:0;width:0;height:${H}px;border-left:.5px solid ${t.rule}`);
 }
 // header
 const monthLbl={modern:"4月",grid:"4月",table:"4月",paper:"四月",board:"4月"}[id];
 A(P,`left:0;top:0;width:${g.axis}px;height:${g.head}px;display:flex;align-items:center;justify-content:center;font:${id=="paper"?"600 12px var(--song)":"600 11px var(--sans)"};color:${t.ink2}`,monthLbl);
 DAYS.forEach((d,i)=>{
  const x=colX(i),isT=d.today;
  const cell=A(P,`left:${x}px;top:0;width:${colW}px;height:${g.head}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${id=="paper"?2:1}px`);
  if(id=="modern"){
   cell.innerHTML=`<div style="font:600 15px var(--round);color:${isT?t.acc:(d.holiday?t.ink3:t.ink)}">${d.d}</div><div style="font:500 11px var(--sans);color:${isT?t.acc:t.ink2}">${isT?"今天":d.w}</div>`;
  } else if(id=="table"){
   if(isT){cell.style.background=t.accF;}
   const adjc=d.adj=="休"?(dark?"#FF6B81":"#D61F45"):(dark?"#FF9A5C":"#C2410C");
   cell.innerHTML=`<div style="font:600 12px var(--sans);color:${isT?t.on:t.ink}">${isT?"今天":d.w}</div><div style="font:500 10px var(--mono);color:${isT?t.on:t.ink2};opacity:${isT?.9:1}">4/${d.d}${d.adj?`<b style="font:700 10px var(--sans);color:${adjc};margin-left:2px">${d.adj}</b>`:""}</div>`;
  } else if(id=="paper"){
   const num=`<div style="font:400 17px var(--serif);color:${isT?t.acc:(d.holiday?t.ink3:t.ink)};width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:50%;${isT?`border:1.2px solid ${t.acc};`:""}">${d.d}</div>`;
   cell.innerHTML=num+`<div style="font:400 11px var(--song);color:${isT?t.acc:t.ink2}">${isT?"今日":d.w}</div>`;
  } else {
   cell.innerHTML=`<div style="font:700 12.5px var(--sans);color:${t.ink}">${isT?"今天":d.w}</div><div style="font:500 10.5px var(--mono);color:${t.ink2};display:flex;align-items:center;gap:2px">${String(d.d).padStart(2,"0")}${d.adj?`<span style="font:700 8.5px var(--sans);padding:0 2px;line-height:12px;${d.adj=="休"?`background:${t.ink};color:${t.canvas}`:`border:1px solid ${t.ink};color:${t.ink};line-height:10px`}">${d.adj}</span>`:""}</div>`+(isT?`<div style="position:absolute;left:4px;right:4px;bottom:0;height:3px;background:${t.acc}"></div>`:"");
  }
  if(d.adj&&(id=="modern"||id=="paper")){
   const off=d.adj=="休";let css,txt=d.adj;
   if(id=="modern")css=`width:14px;height:14px;border-radius:4px;background:${off?"#E11D48":"#C2410C"};color:#fff;font:600 9px var(--sans);top:3px;right:2px`;
   if(id=="table")css=`width:14px;height:14px;background:${off?"#E11D48":"#C2410C"};color:#fff;font:600 9px var(--sans);top:0;right:0`;
   if(id=="paper")css=off?`width:14px;height:14px;border-radius:2px;background:${t.accF};color:${t.on};font:700 9.5px var(--song);top:4px;right:3px`:`width:14px;height:14px;border-radius:2px;border:1px solid ${t.ink2};color:${t.ink2};font:700 9.5px var(--song);top:4px;right:3px`;
   if(id=="board")css=off?`width:15px;height:15px;background:${t.ink};color:${t.canvas};font:700 9.5px var(--sans);top:3px;right:2px`:`width:15px;height:15px;border:1.2px solid ${t.ink};color:${t.ink};font:700 9.5px var(--sans);top:3px;right:2px`;
   A(P,`left:${x+colW-16}px;display:flex;align-items:center;justify-content:center;${css};left:auto;right:${g.w-(x+colW)+(id=="table"?0:2)}px`,txt);
  }
 });
 // axis
 PERIODS.forEach((pp,i)=>{
  const y=g.head+rowY(i);
  let html;
  if(id=="modern")html=`<div style="font:700 14px var(--round);color:${t.ink}">${i+1}</div><div style="font:600 9.5px var(--sans);color:${t.ink2};letter-spacing:-.2px">${pp[0]}</div>`;
  if(id=="table")html=`<div style="font:700 12.5px var(--sans);color:${t.ink}">${i+1}</div><div style="font:500 8.5px/1.25 var(--mono);color:${t.ink2};letter-spacing:-.3px;text-align:center">${pp[0]}<br>${pp[1]}</div>`;
  if(id=="paper")html=`<div style="font:400 13px var(--song);color:${t.ink}">${CN[i]}</div><div style="font:400 9.5px var(--serif);color:${t.ink2}">${pp[0]}</div>`;
  if(id=="board")html=`<div style="font:700 13px var(--mono);color:${t.ink}">${String(i+1).padStart(2,"0")}</div><div style="font:500 9px var(--mono);color:${t.ink2}">${pp[0]}</div>`;
  A(P,`left:0;top:${y}px;width:${g.axis}px;height:${g.row}px;display:flex;flex-direction:column;align-items:center;justify-content:${id=="board"?"flex-start":"center"};padding-top:${id=="board"?7:0}px;gap:2px`,html);
 });
 // holiday label
 const hl={modern:`font:500 12px var(--sans);color:${t.ink3};letter-spacing:6px`,table:`font:600 12px var(--sans);color:${t.ink3};letter-spacing:6px`,paper:`font:400 15px var(--song);color:${t.acc};opacity:.55;letter-spacing:10px`,board:`font:700 12px var(--sans);color:${t.ink3};letter-spacing:5px`}[id];
 A(P,`left:${colX(0)}px;top:${g.head+rowY(3)}px;width:${colW}px;display:flex;justify-content:center;writing-mode:vertical-rl;${hl}`,id=="board"?"清明·停课":"清明假期");
 // now line (under the courses for paper/board)
 const ny=g.head+rowY(NOW.period)+NOW.frac*g.row;
 if(id=="paper")A(P,`left:${g.axis}px;top:${ny-.5}px;width:${g.w-g.axis-g.pad}px;height:0;border-top:1px dashed ${t.acc};opacity:.45`);
 if(id=="board")A(P,`left:${g.axis}px;top:${ny-1}px;width:${g.w-g.axis}px;height:2px;background:${t.ink}`);
 // courses
 SCHED.forEach(([day,st,span,k])=>{
  const c=C[k],col=S.course(c.h,dark);
  const x=colX(day)+g.inset,y=g.head+rowY(st-1)+g.inset,w=colW-2*g.inset,h=rowY(st-1+span)-rowY(st-1)-2*g.inset;
  const isNow=day==NOW.day&&st<=NOW.period+1&&NOW.period+1<st+span;
  if(id=="modern"){
   A(P,`left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:9px;background:${col.fill};padding:6px 5px 5px 6px`,`<div class="clamp" style="-webkit-line-clamp:3;font:600 12px/1.22 var(--sans);color:${col.text}">${c.n}</div><div class="clamp" style="-webkit-line-clamp:2;margin-top:3px;font:500 10px/1.2 var(--sans);color:${col.sub}">@${c.r}</div>`);
  } else if(id=="table"){
   A(P,`left:${x+.5}px;top:${y+.5}px;width:${w-.5}px;height:${h-.5}px;background:${col.fill};border-left:3px solid ${col.bar};padding:5px 3px 4px 4px`,`<div class="clamp" style="-webkit-line-clamp:3;font:600 11.5px/1.2 var(--sans);color:${col.text}">${c.n}</div><div class="clamp" style="-webkit-line-clamp:2;margin-top:3px;font:500 9.5px/1.2 var(--sans);color:${col.sub}">${c.r}</div>`);
  } else if(id=="paper"){
   A(P,`left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:2px;background:${col.fill};border-left:2px solid ${col.bar};padding:6px 3px 4px 5px`,`<div class="clamp" style="-webkit-line-clamp:3;font:700 12px/1.25 var(--song);color:${col.text}">${c.n}</div><div class="clamp" style="-webkit-line-clamp:2;margin-top:4px;font:400 9.5px/1.2 var(--sans);color:${col.sub}">${c.r}</div>`);
  } else {
   const inv=isNow;
   A(P,`left:${x+1}px;top:${y+1}px;width:${w-2}px;height:${h-1}px;${inv?`background:${t.accF};`:""}padding:6px 3px 4px 4px`,`<div class="clamp" style="-webkit-line-clamp:3;font:700 11.5px/1.2 var(--sans);color:${inv?t.on:t.ink}"><span style="display:inline-block;width:7px;height:7px;margin-right:3px;vertical-align:1px;background:${inv?t.on:col.dot}"></span>${c.n}</div><div class="clamp" style="-webkit-line-clamp:2;margin-top:3px;font:500 9px/1.2 var(--mono);color:${inv?t.on:t.ink2};opacity:${inv?.9:1}">${c.r}</div>`);
  }
 });
 // now markers
 if(id=="modern"){
  A(P,`left:${colX(2)-1}px;top:${ny-.75}px;width:${colW+2}px;height:1.5px;background:${t.acc}`);
  A(P,`left:1px;top:${ny-8}px;width:${g.axis-1}px;height:16px;border-radius:8px;background:${t.accF};color:${t.on};font:600 9px var(--sans);display:flex;align-items:center;justify-content:center;letter-spacing:-.3px`,NOW.label);
 }
 if(id=="table"){
  A(P,`left:${colX(2)}px;top:${ny-1}px;width:${colW}px;height:2px;background:${t.acc}`);
  A(P,`left:0;top:${ny-8}px;width:${g.axis}px;height:16px;background:${t.accF};color:${t.on};font:600 9px var(--mono);display:flex;align-items:center;justify-content:center`,NOW.label);
 }
 if(id=="paper"){
  A(P,`left:${colX(2)}px;top:${ny-.6}px;width:${colW}px;height:1.2px;background:${t.acc}`);
  A(P,`left:-2px;top:${ny-8}px;width:${g.axis+2}px;height:16px;background:${t.accF};color:${t.on};font:400 9.5px var(--serif);display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%)`,NOW.label);
 }
 if(id=="board"){
  A(P,`left:3px;top:${ny-8}px;width:${g.axis-5}px;height:16px;background:${t.ink};color:${t.canvas};font:600 9px var(--mono);display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%)`,NOW.label);
 }
 tabBar(p,id,t,dark);homeBar(p,t);
 return p;
}

// ---------- boards ----------
function caption(id,extra){const S=STY[id];return E("div","",`<b>${S.name}${extra||""}</b><span>${S.desc}</span>`,"cap")}
function board(title,sub,cols){
 const root=document.getElementById("root");
 root.appendChild(E("div","",`${title}<small>${sub}</small>`,"title"));
 const b=E("div","",null,"board");cols.forEach(c=>b.appendChild(c));root.appendChild(b);
}
function col(nodes){const c=E("div","",null,"col");nodes.forEach(n=>c.appendChild(n));return c}
const mode=location.hash.slice(1)||"week-light";
const ids=["modern","grid","table","paper","board"];
window.addEventListener("DOMContentLoaded",()=>{
if(mode=="week-light")board("周视图 · 浅色","示意数据：第 7 周，周一清明放假，周日调休上班，现在是周三 11:05",ids.map(id=>col([caption(id),weekPhone(id,false)])));
if(mode=="week-dark")board("周视图 · 深色","同一组数据，深色外观",ids.map(id=>col([caption(id,"（深色）"),weekPhone(id,true)])));
});
</script>
