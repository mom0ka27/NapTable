name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/**"
      - "tests/test_*.py"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: naptable-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run server tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NAP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAP_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          NAP_SSH_TARGET: ${{ secrets.NAP_SSH_TARGET }}
          NAPTABLE_SKIP_TESTS: "1"
        run: |
          test -n "$NAP_SSH_TARGET"
          ./deploy/deploy.sh "$NAP_SSH_TARGET"
