# 校园网常见大量用户共用一个出口 IP：公开只读接口和官网放宽，
# 管理员登录单独收紧，其余接口保持原来的限额。
limit_req_zone $binary_remote_addr zone=naptable_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=naptable_public:10m rate=30r/s;
# 只有 POST（提交令牌登录）进登录限额；GET 查会话、DELETE 退出的键为空，不受这一条限制。
map $request_method $naptable_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $naptable_login_key zone=naptable_login:10m rate=1r/s;
# 发布、替换分享（POST）另加一道按 IP 的限额；读取分享的 GET 不受影响。
# 限额按校园网 NAT 放宽，按设备、账户的细分配额由服务端自己做。
map $request_method $naptable_publish_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $naptable_publish_key zone=naptable_publish:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name __NAPTABLE_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __NAPTABLE_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__NAPTABLE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__NAPTABLE_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NapTableTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # 图片上传有独立的大小和等待时间上限，其余接口仍使用 1 MB。
    location = /v1/import/image {
        client_max_body_size 5m;
        # App Attest and the service quotas distinguish devices behind one
        # campus NAT. Keep only the broad public edge rate here.
        limit_req zone=naptable_public burst=120 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 30s;
    }

    # 公开只读接口：学校模板、统一假期、使用量上报，以及官网首页、隐私协议和 /site/ 静态资源。
    location = / {
        limit_req zone=naptable_public burst=120 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(v1/schools|v1/calendar|privacy/?)$ {
        limit_req zone=naptable_public burst=120 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /site/ {
        limit_req zone=naptable_public burst=120 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /v1/usage/ {
        limit_req zone=naptable_public burst=120 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 管理员登录：防止爆破令牌。
    location = /v1/admin/session {
        limit_req zone=naptable_login burst=5 nodelay;
        limit_req zone=naptable_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /v1/shares {
        limit_req zone=naptable_publish burst=30 nodelay;
        limit_req zone=naptable_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_req zone=naptable_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
