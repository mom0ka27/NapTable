[project]
name = "naptable-server"
version = "0"
description = "NapTable schedule, share and live-activity server"
requires-python = ">=3.14"
dependencies = [
    # HTTP layer: one uvicorn process serving the FastAPI app (h11, no extras).
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    # Required only when remote push-to-start tokens are registered.
    "cryptography>=44.0.0,<47",
    "pillow>=12.0.0,<13",
]

[tool.uv]
# The server runs from its source tree; there is nothing to build or install.
package = false
